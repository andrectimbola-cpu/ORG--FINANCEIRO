<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f2f4f7; color:#1e2430; padding:20px; line-height:1.4; }
  h1 { font-size:22px; margin-bottom:4px; color:#141924; }
  .sub { color:#6b7482; font-size:13px; margin-bottom:20px; }
  .status { font-size:12px; margin-bottom:16px; padding:8px 12px; border-radius:8px; display:inline-block; }
  .status.ok { background:#e0f5eb; color:#1a9c66; }
  .status.erro { background:#fbe4e4; color:#d64545; }
  .status.sync { background:#e3edfb; color:#3b7ddd; }
  .painel { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:14px; }
  .card { background:#ffffff; border:1px solid #e2e6ec; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(30,40,60,.05); }
  .card .label { font-size:12px; color:#6b7482; text-transform:uppercase; letter-spacing:.5px; }
  .card .valor { font-size:24px; font-weight:700; margin-top:6px; }
  .verde { color:#159a5f; } .vermelho { color:#d64545; } .amarelo { color:#c88a00; } .azul { color:#2f6fd6; } .roxo { color:#8a4fd6; }
  .painel-cartoes { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:28px; }
  .mes { background:#ffffff; border:1px solid #e2e6ec; border-radius:14px; margin-bottom:20px; overflow:hidden; box-shadow:0 1px 3px rgba(30,40,60,.05); }
  .mes-header { padding:16px 20px; background:#f7f9fb; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eef1f5; }
  .mes-header h2 { font-size:18px; text-transform:capitalize; color:#141924; }
  .mes-resumo { display:flex; gap:18px; font-size:13px; flex-wrap:wrap; color:#6b7482; }
  .mes-resumo span b { display:block; font-size:15px; }
  .mes-body { padding:20px; display:none; }
  .mes.aberto .mes-body { display:block; }
  .mes-mini { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
  .mini { background:#f7f9fb; border-radius:10px; padding:12px; border:1px solid #eef1f5; }
  .mini .label { font-size:11px; color:#6b7482; text-transform:uppercase; }
  .mini .valor { font-size:18px; font-weight:600; margin-top:4px; }

<body>
  <h1>ContaLeve</h1>
  <div class="sub">Controle de receitas e despesas — Agosto a Dezembro</div>
  <div id="status" class="status sync">Conectando...</div>
  <div class="painel" id="painelGeral"></div>
  <div class="painel-cartoes" id="painelCartoes"></div>
  <div class="alerta-topo" id="alertaTopo"></div>
  <div class="toolbar">
    <button onclick="expandirTodos(true)">Expandir todos</button>
    <button onclick="expandirTodos(false)">Recolher todos</button>
    <button onclick="recarregar()">Atualizar</button>
  </div>
  <div id="meses"></div>
<script>
// ==========================================================
//  CONFIGURACAO DO SUPABASE - cole aqui suas 2 informacoes
// ==========================================================
const SUPABASE_URL  = 'https://jhxxycotfbczgutrqgll.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_WY2pypkIGU6xBOm21AXMbA_TdCtzxkZ';
// ==========================================================

const MESES = ['agosto','setembro','outubro','novembro','dezembro'];
const CARTOES = ['Nubank','Evolua'];
const TABELA = 'organizador_lancamentos';
const TABELA_CM = 'cartao_mes';
const TABELA_CH = 'cartao_historico';
let sb = null;

let dados = {};
MESES.forEach(m => dados[m] = { receitas:[], despesas:[] });
let cartaoMes = {};   // cartaoMes[mes][cartao] = {id, valor_manual, pago}
let historico = {};   // historico[mes+'|'+cartao] = [ {valor, pago_em} ]
let timers = {};
let digitando = false;      // true enquanto um input esta focado
let refreshPendente = false; // guarda que chegou update enquanto digitava
let canalRealtime = null;

function setStatus(txt, cls){ const el = document.getElementById('status'); el.textContent = txt; el.className = 'status ' + cls; }
function fmt(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function num(v){ return parseFloat(v)||0; }

async function carregar(){
  setStatus('Carregando...', 'sync');
  const r1 = await sb.from(TABELA).select('*').order('ordem',{ascending:true});
  if(r1.error){ setStatus('Erro ao carregar: '+r1.error.message, 'erro'); return; }
  MESES.forEach(m => dados[m] = { receitas:[], despesas:[] });
  r1.data.forEach(row => { if(!dados[row.mes]) return; if(row.categoria === 'receita') dados[row.mes].receitas.push(row); else dados[row.mes].despesas.push(row); });

  // cartao_mes
  cartaoMes = {};
  MESES.forEach(m => { cartaoMes[m] = {}; });
  const r2 = await sb.from(TABELA_CM).select('*');
  if(!r2.error && r2.data){ r2.data.forEach(row => { if(cartaoMes[row.mes]) cartaoMes[row.mes][row.cartao] = row; }); }

  // historico
  historico = {};
  const r3 = await sb.from(TABELA_CH).select('*').order('pago_em',{ascending:false});
  if(!r3.error && r3.data){ r3.data.forEach(row => { const k = row.mes+'|'+row.cartao; (historico[k] = historico[k] || []).push(row); }); }

  setStatus('Sincronizado', 'ok'); render();
}
async function recarregar(){ await carregar(); }

// --- controle de foco: nao atualizar a tela enquanto o usuario digita ---
document.addEventListener('focusin', (e)=>{
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='SELECT')) digitando = true;
});
document.addEventListener('focusout', (e)=>{
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='SELECT')){
    digitando = false;
    // se chegou atualizacao de outra pessoa enquanto eu digitava, aplica agora
    if(refreshPendente){ refreshPendente = false; recarregarSuave(); }
  }
});

// recarrega os dados sem baguncar quem esta digitando
async function recarregarSuave(){
  if(digitando){ refreshPendente = true; return; }
  await carregar();
}

// --- Realtime: assina mudancas nas 3 tabelas ---
function assinarRealtime(){
  try{
    canalRealtime = sb.channel('org-financeiro')
      .on('postgres_changes', { event:'*', schema:'public', table:TABELA }, ()=> recarregarSuave())
      .on('postgres_changes', { event:'*', schema:'public', table:TABELA_CM }, ()=> recarregarSuave())
      .on('postgres_changes', { event:'*', schema:'public', table:TABELA_CH }, ()=> recarregarSuave())
      .subscribe();
  }catch(e){ /* se realtime nao estiver ligado, segue sem tempo real */ }
}

function totalReceitasMes(m){ return dados[m].receitas.reduce((s,r)=>s+num(r.valor),0); }
function totalDespesasMes(m){
  let total = 0;
  // boletos + fixas (sempre por lancamento)
  dados[m].despesas.forEach(d=>{ if(d.tipo!=='cartao') total += num(d.valor); });
  // cartoes: usa valorCartao (manual manda, senao soma lancamentos)
  CARTOES.forEach(c=> total += valorCartao(m,c));
  return total;
}
function totalCartaoNome(m,nome){ return valorCartao(m, nome); }
function totalBoletoMes(m){ return dados[m].despesas.filter(d=>d.tipo==='boleto').reduce((s,r)=>s+num(r.valor),0); }
function totalFixaMes(m){ return dados[m].despesas.filter(d=>d.tipo==='fixa').reduce((s,r)=>s+num(r.valor),0); }
function totalDiversasMes(m){ return dados[m].despesas.filter(d=>d.tipo==='diversas').reduce((s,r)=>s+num(r.valor),0); }
// pagos = despesas marcadas como pago
function totalPagoMes(m){
  // pago de boletos/fixas + cartoes que usam lancamentos individuais (sem valor manual)
  let pago = 0;
  dados[m].despesas.filter(d=>d.pago).forEach(d=>{
    if(d.tipo==='cartao'){
      // so conta se esse cartao NAO tem valor manual (senao seria dobrado)
      const o = cmObj(m, d.cartao);
      const temManual = o && o.valor_manual!==null && o.valor_manual!==undefined && o.valor_manual!=='';
      if(!temManual) pago += num(d.valor);
    } else {
      pago += num(d.valor);
    }
  });
  // cartoes marcados como pagos no proprio card
  CARTOES.forEach(c=>{ if(cartaoPago(m,c)) pago += valorCartao(m,c); });
  return pago;
}
function totalAbertoMes(m){ return totalDespesasMes(m) - totalPagoMes(m); }
// recebidos = receitas marcadas como pago (recebido)
function totalRecebidoMes(m){ return dados[m].receitas.filter(r=>r.pago).reduce((s,r)=>s+num(r.valor),0); }
// filtros por bloco de despesa
function despBloco(m, tipo, cartao){
  return dados[m].despesas.filter(d => {
    if(tipo==='cartao') return d.tipo==='cartao' && d.cartao===cartao;
    return d.tipo===tipo;
  });
}
function somaBloco(itens){ return itens.reduce((s,r)=>s+num(r.valor),0); }
function pagoBloco(itens){ return itens.filter(r=>r.pago).reduce((s,r)=>s+num(r.valor),0); }

// --- vencimento ---
// converte 'yyyy-mm-dd' (banco) para 'dd/mm/aaaa' (tela)
function isoParaBR(iso){
  if(!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  if(p.length!==3) return '';
  return p[2]+'/'+p[1]+'/'+p[0];
}
// converte 'dd/mm/aaaa' (tela) para 'yyyy-mm-dd' (banco); retorna null se incompleto/invalido
function brParaISO(br){
  if(!br) return null;
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  const dd=+m[1], mm=+m[2], aa=+m[3];
  if(mm<1||mm>12||dd<1||dd>31) return null;
  return m[3]+'-'+m[2]+'-'+m[1];
}
// formata enquanto digita: coloca as barras automaticamente
function mascaraData(el, id){
  let v = el.value.replace(/\D/g,'').slice(0,8);
  let out = v;
  if(v.length>=5) out = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>=3) out = v.slice(0,2)+'/'+v.slice(2);
  el.value = out;
  // se completou dd/mm/aaaa valido, salva no banco
  const iso = brParaISO(out);
  if(iso){ edit(id,'vencimento',iso); }
  else if(out===''){ edit(id,'vencimento',null); }
}

function hojeISO(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function statusVenc(item){
  // retorna '', 'vencido' ou 'breve'
  if(item.pago) return '';
  if(!item.vencimento) return '';
  const hoje = hojeISO();
  const v = new Date(item.vencimento + 'T00:00:00');
  const diff = Math.round((v - hoje) / 86400000);
  if(diff < 0) return 'vencido';
  if(diff <= 3) return 'breve';
  return '';
}
function classeVenc(item){
  const st = statusVenc(item);
  return st==='vencido' ? 'vencido-row' : (st==='breve' ? 'vencebreve-row' : (item.pago?'pago-row':''));
}
function badgeVenc(item){
  const st = statusVenc(item);
  if(st==='vencido') return '<span class="badge-venc venc">VENCIDO</span>';
  if(st==='breve') return '<span class="badge-venc breve">VENCE JA</span>';
  return '';
}
// contagem no ano todo (despesas com vencimento)
function alertaTopoHtml(){
  const c = contarVencidos();
  let chips = '';
  if(c.venc>0) chips += `<div class="alerta-chip venc">${c.venc} boleto(s) VENCIDO(S)</div>`;
  if(c.breve>0) chips += `<div class="alerta-chip breve">${c.breve} vence(m) em ate 3 dias</div>`;
  if(c.venc===0 && c.breve===0) chips = `<div class="alerta-chip ok">Nenhum vencimento em atraso</div>`;
  return chips;
}
function atualizarAlertaTopo(){
  const el = document.getElementById('alertaTopo');
  if(el) el.innerHTML = alertaTopoHtml();
}
function contarVencidos(){
  let venc=0, breve=0;
  MESES.forEach(m=>{
    dados[m].despesas.forEach(d=>{
      const st = statusVenc(d);
      if(st==='vencido') venc++;
      else if(st==='breve') breve++;
    });
  });
  return { venc, breve };
}

// --- cartao mes: valor manual manda; senao soma dos lancamentos ---
function cmObj(m, cartao){ return (cartaoMes[m] && cartaoMes[m][cartao]) ? cartaoMes[m][cartao] : null; }
function valorCartao(m, cartao){
  const o = cmObj(m, cartao);
  if(o && o.valor_manual !== null && o.valor_manual !== undefined && o.valor_manual !== '') return num(o.valor_manual);
  return somaBloco(despBloco(m, 'cartao', cartao));
}
function cartaoPago(m, cartao){ const o = cmObj(m, cartao); return !!(o && o.pago); }
function valorCartaoPago(m, cartao){ return cartaoPago(m, cartao) ? valorCartao(m, cartao) : 0; }

function render(){
  let recTotal=0, despTotal=0, pagoTotal=0, recebidoTotal=0;
  MESES.forEach(m => { recTotal+=totalReceitasMes(m); despTotal+=totalDespesasMes(m); pagoTotal+=totalPagoMes(m); recebidoTotal+=totalRecebidoMes(m); });
  const saldo = recTotal - despTotal;
  const abertoTotal = despTotal - pagoTotal;
  document.getElementById('painelGeral').innerHTML = `
    <div class="card"><div class="label">Receita ate dezembro</div><div class="valor verde">${fmt(recTotal)}</div></div>
    <div class="card"><div class="label">Divida ate dezembro</div><div class="valor vermelho">${fmt(despTotal)}</div></div>
    <div class="card"><div class="label">Ja pago (ano)</div><div class="valor roxo">${fmt(pagoTotal)}</div></div>
    <div class="card"><div class="label">Falta pagar (ano)</div><div class="valor amarelo">${fmt(abertoTotal)}</div></div>
    <div class="card"><div class="label">Saldo projetado</div><div class="valor ${saldo>=0?'verde':'vermelho'}">${fmt(saldo)}</div></div>`;
  let nubank=0, evolua=0, boletos=0, diversasAno=0;
  MESES.forEach(m => { nubank+=totalCartaoNome(m,'Nubank'); evolua+=totalCartaoNome(m,'Evolua'); boletos+=totalBoletoMes(m); diversasAno+=totalDiversasMes(m); });
  document.getElementById('painelCartoes').innerHTML = `
    <div class="card"><div class="label">Cartao Nubank (total)</div><div class="valor azul">${fmt(nubank)}</div></div>
    <div class="card"><div class="label">Cartao Evolua (total)</div><div class="valor azul">${fmt(evolua)}</div></div>
    <div class="card"><div class="label">Boletos (total)</div><div class="valor amarelo">${fmt(boletos)}</div></div>
    <div class="card"><div class="label">Despesas diversas (ano)</div><div class="valor roxo">${fmt(diversasAno)}</div></div>
    <div class="card"><div class="label">Recebido (ano)</div><div class="valor verde">${fmt(recebidoTotal)}</div></div>`;
  atualizarAlertaTopo();
  const abertos = [...document.querySelectorAll('.mes.aberto')].map(e=>e.dataset.mes);
  document.getElementById('meses').innerHTML = MESES.map(m => renderMes(m, abertos.includes(m))).join('');
}

function miniCardsHtml(m){
  const rec = totalReceitasMes(m), pago = totalPagoMes(m), abertoVal = totalAbertoMes(m), recebido = totalRecebidoMes(m);
  return `
    <div class="mini"><div class="label">Cartao Nubank</div><div class="valor azul">${fmt(totalCartaoNome(m,'Nubank'))}</div></div>
    <div class="mini"><div class="label">Cartao Evolua</div><div class="valor azul">${fmt(totalCartaoNome(m,'Evolua'))}</div></div>
    <div class="mini"><div class="label">Boletos</div><div class="valor amarelo">${fmt(totalBoletoMes(m))}</div></div>
    <div class="mini"><div class="label">Despesas fixas</div><div class="valor vermelho">${fmt(totalFixaMes(m))}</div></div>
    <div class="mini"><div class="label">Despesas diversas</div><div class="valor roxo">${fmt(totalDiversasMes(m))}</div></div>
    <div class="mini"><div class="label">A receber</div><div class="valor verde">${fmt(rec)}</div></div>
    <div class="mini"><div class="label">Recebido</div><div class="valor verde">${fmt(recebido)}</div></div>
    <div class="mini"><div class="label">Pago</div><div class="valor roxo">${fmt(pago)}</div></div>
    <div class="mini"><div class="label">Falta pagar</div><div class="valor amarelo">${fmt(abertoVal)}</div></div>`;
}

function renderMes(m, aberto){
  const rec = totalReceitasMes(m), desp = totalDespesasMes(m), saldo = rec - desp;
  const pago = totalPagoMes(m), abertoVal = totalAbertoMes(m), recebido = totalRecebidoMes(m);

  // Blocos de cartao (editaveis, com pago e historico)
  const cartaoHtml = CARTOES.map(c => renderCartaoBloco(m, c)).join('');

  // Blocos simples: boletos e fixas
  const blocosSimples = [
    { titulo:'Boletos',          tipo:'boleto',   classe:'amarelo' },
    { titulo:'Despesas fixas',   tipo:'fixa',     classe:'vermelho' },
    { titulo:'Despesas diversas',tipo:'diversas', classe:'roxo' }
  ];
  const blocosHtml = cartaoHtml + blocosSimples.map(b => {
    const itens = despBloco(m, b.tipo, null);
    const soma = somaBloco(itens), pg = pagoBloco(itens);
    const rows = itens.length ? itens.map(d => `
      <tr class="${classeVenc(d)}">
        <td class="th-pago"><input type="checkbox" class="chk" ${d.pago?'checked':''} onchange="edit('${d.id}','pago',this.checked)"></td>
        <td><input type="text" value="${(d.descricao||'').replace(/"/g,'&quot;')}" oninput="edit('${d.id}','descricao',this.value)" placeholder="Descricao">${badgeVenc(d)}</td>
        <td style="width:130px"><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${isoParaBR(d.vencimento)}" oninput="mascaraData(this,'${d.id}')"></td>
        <td class="col-valor" style="width:140px"><input type="number" value="${d.valor||''}" oninput="edit('${d.id}','valor',this.value)" placeholder="0,00" step="0.01"></td>
        <td style="width:40px"><button class="del" onclick="remover('${d.id}','${m}')">&times;</button></td>
      </tr>`).join('') : `<tr><td colspan="5" class="empty">Nenhum lancamento.</td></tr>`;
    return `
      <div class="secao">
        <div class="secao-title">
          <h3 class="${b.classe}">${b.titulo}</h3>
          <div class="btns"><button class="add" onclick="adicionarDespesa('${m}','${b.tipo}','')">+</button></div>
        </div>
        <table><thead><tr><th class="th-pago">Pago</th><th>Descricao</th><th>Vencimento</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>${rows}</tbody></table>
        <div class="footer-mes" style="justify-content:flex-start;gap:20px">
          <span>Subtotal: <b class="${b.classe}">${fmt(soma)}</b></span>
          <span>Pago: <b class="roxo">${fmt(pg)}</b></span>
          <span>Falta: <b class="amarelo">${fmt(soma-pg)}</b></span>
        </div>
      </div>`;
  }).join('');

  // Bloco de receitas
  const receitasRows = dados[m].receitas.length ? dados[m].receitas.map(r=>`
    <tr class="${r.pago?'pago-row':''}">
      <td class="th-pago"><input type="checkbox" class="chk" ${r.pago?'checked':''} onchange="edit('${r.id}','pago',this.checked)"></td>
      <td><input type="text" value="${(r.descricao||'').replace(/"/g,'&quot;')}" oninput="edit('${r.id}','descricao',this.value)" placeholder="Descricao"></td>
      <td class="col-valor" style="width:140px"><input type="number" value="${r.valor||''}" oninput="edit('${r.id}','valor',this.value)" placeholder="0,00" step="0.01"></td>
      <td style="width:40px"><button class="del" onclick="remover('${r.id}','${m}')">&times;</button></td>
    </tr>`).join('') : `<tr><td colspan="4" class="empty">Nenhuma receita.</td></tr>`;

  return `
  <div class="mes ${aberto?'aberto':''}" data-mes="${m}">
    <div class="mes-header" onclick="toggleMes('${m}')">
      <h2>${m}</h2>
      <div class="mes-resumo">
        <span>Receita <b class="verde">${fmt(rec)}</b></span>
        <span>Despesa <b class="vermelho">${fmt(desp)}</b></span>
        <span>Pago <b class="roxo">${fmt(pago)}</b></span>
        <span>Saldo <b class="${saldo>=0?'verde':'vermelho'}">${fmt(saldo)}</b></span>
      </div>
    </div>
    <div class="mes-body">
      <div class="mes-mini" id="mini-${m}">${miniCardsHtml(m)}</div>

      ${blocosHtml}

      <div class="secao">
        <div class="secao-title"><h3 class="verde">Receitas</h3><div class="btns"><button class="add" onclick="adicionar('${m}','receita')">+</button></div></div>
        <table><thead><tr><th class="th-pago">Rec.</th><th>Descricao</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>${receitasRows}</tbody></table>
      </div>

      <div class="footer-mes">
        <span>Total receitas: <b class="verde">${fmt(rec)}</b></span>
        <span>Total despesas: <b class="vermelho">${fmt(desp)}</b></span>
        <span>Pago: <b class="roxo">${fmt(pago)}</b></span>
        <span>Falta pagar: <b class="amarelo">${fmt(abertoVal)}</b></span>
        <span>Saldo: <b class="${saldo>=0?'verde':'vermelho'}">${fmt(saldo)}</b></span>
      </div>
    </div>
  </div>`;
}

function dicaCartaoTexto(m, cartao){
  const o = cmObj(m, cartao);
  const temManual = o && o.valor_manual!==null && o.valor_manual!==undefined && o.valor_manual!=='';
  const somaLanc = somaBloco(despBloco(m,'cartao',cartao));
  const valorEfetivo = valorCartao(m, cartao);
  const msg = temManual ? 'Usando o valor digitado (ignora os lancamentos abaixo).'
            : (somaLanc>0 ? 'Somando os lancamentos abaixo. Digite um total para substituir.'
            : 'Digite o total do cartao ou adicione lancamentos no +.');
  return `${msg} Valor atual: <b>${fmt(valorEfetivo)}</b>`;
}
function atualizarMiniMes(m){
  const el = document.getElementById('mini-'+m);
  if(el) el.innerHTML = miniCardsHtml(m);
}
function atualizarDicaCartao(m, cartao){
  const el = document.getElementById('hint-'+m+'-'+cartao);
  if(el) el.innerHTML = dicaCartaoTexto(m, cartao);
}

function renderCartaoBloco(m, cartao){
  const o = cmObj(m, cartao);
  const temManual = o && o.valor_manual!==null && o.valor_manual!==undefined && o.valor_manual!=='';
  const valorEfetivo = valorCartao(m, cartao);
  const somaLanc = somaBloco(despBloco(m,'cartao',cartao));
  const pago = cartaoPago(m, cartao);
  const key = m+'|'+cartao;
  const hist = historico[key] || [];

  const histRows = hist.length ? hist.map(h=>`
    <div class="hist-item"><span>${fmt(h.valor)}</span><span class="data">${new Date(h.pago_em).toLocaleDateString('pt-BR')} ${new Date(h.pago_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>
  `).join('') : `<div class="empty">Nenhum pagamento registrado ainda.</div>`;

  const valInput = temManual ? o.valor_manual : '';

  return `
  <div class="secao">
    <div class="cartao-box ${pago?'':''}" style="${pago?'background:#eafaf1;border-color:#bfe8d0;':''}">
      <div class="cartao-top">
        <h3 class="azul">${cartao}</h3>
        <div class="campo-valor">
          <label>Total do mes</label>
          <input type="number" class="valor-manual" step="0.01" placeholder="${fmt(somaLanc).replace('R$','').trim()}" value="${valInput}"
                 oninput="setCartaoValor('${m}','${cartao}',this.value)">
        </div>
        <button class="btn-pago ${pago?'on':''}" onclick="toggleCartaoPago('${m}','${cartao}')">${pago?'Pago ✓':'Marcar pago'}</button>
        <button class="btn-hist" onclick="toggleHist('${m}','${cartao}')">Historico (${hist.length})</button>
      </div>
      <div class="hint" id="hint-${m}-${cartao}">${dicaCartaoTexto(m, cartao)}</div>
      <div class="hist-lista" id="hist-${m}-${cartao}">
        <div style="font-size:12px;color:#6b7482;text-transform:uppercase;margin-bottom:6px">Historico de pagamentos</div>
        ${histRows}
      </div>
    </div>
    <div class="secao-title" style="margin-top:4px">
      <h3 class="azul" style="font-size:13px">Lancamentos ${cartao} (opcional)</h3>
      <div class="btns"><button class="add" onclick="adicionarDespesa('${m}','cartao','${cartao}')">+</button></div>
    </div>
    <table><thead><tr><th class="th-pago">Pago</th><th>Descricao</th><th>Vencimento</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>${
      despBloco(m,'cartao',cartao).length ? despBloco(m,'cartao',cartao).map(d=>`
        <tr class="${classeVenc(d)}">
          <td class="th-pago"><input type="checkbox" class="chk" ${d.pago?'checked':''} onchange="edit('${d.id}','pago',this.checked)"></td>
          <td><input type="text" value="${(d.descricao||'').replace(/"/g,'&quot;')}" oninput="edit('${d.id}','descricao',this.value)" placeholder="Descricao">${badgeVenc(d)}</td>
          <td style="width:130px"><input type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${isoParaBR(d.vencimento)}" oninput="mascaraData(this,'${d.id}')"></td>
          <td class="col-valor" style="width:140px"><input type="number" value="${d.valor||''}" oninput="edit('${d.id}','valor',this.value)" placeholder="0,00" step="0.01"></td>
          <td style="width:40px"><button class="del" onclick="remover('${d.id}','${m}')">&times;</button></td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">Nenhum lancamento (ou usando total digitado).</td></tr>`
    }</tbody></table>
  </div>`;
}

// upsert do valor manual do cartao (debounce)
async function setCartaoValor(m, cartao, valor){
  if(!cartaoMes[m]) cartaoMes[m] = {};
  const atual = cartaoMes[m][cartao] || { mes:m, cartao };
  atual.valor_manual = (valor===''? null : num(valor));
  cartaoMes[m][cartao] = atual;
  atualizarResumos();
  atualizarMiniMes(m);
  atualizarDicaCartao(m, cartao);
  clearTimeout(timers['cv'+m+cartao]);
  setStatus('Salvando...', 'sync');
  timers['cv'+m+cartao] = setTimeout(async ()=>{
    const payload = { mes:m, cartao, valor_manual: atual.valor_manual, pago: !!atual.pago };
    const { data, error } = await sb.from(TABELA_CM).upsert(payload, { onConflict:'mes,cartao' }).select().single();
    if(!error && data){ cartaoMes[m][cartao] = data; }
    setStatus(error? 'Erro: '+error.message : 'Sincronizado', error?'erro':'ok');
  }, 500);
}

// marcar/desmarcar cartao como pago; ao marcar, grava no historico
async function toggleCartaoPago(m, cartao){
  if(!cartaoMes[m]) cartaoMes[m] = {};
  const atual = cartaoMes[m][cartao] || { mes:m, cartao, valor_manual:null };
  const novoPago = !atual.pago;
  atual.pago = novoPago;
  cartaoMes[m][cartao] = atual;
  setStatus('Salvando...', 'sync');
  // salva estado do cartao
  const payload = { mes:m, cartao, valor_manual: (atual.valor_manual??null), pago: novoPago };
  const { data, error } = await sb.from(TABELA_CM).upsert(payload, { onConflict:'mes,cartao' }).select().single();
  if(error){ setStatus('Erro: '+error.message,'erro'); return; }
  cartaoMes[m][cartao] = data;
  // se marcou como pago, registra no historico
  if(novoPago){
    const v = valorCartao(m, cartao);
    const h = { mes:m, cartao, valor:v };
    const r = await sb.from(TABELA_CH).insert(h).select().single();
    if(!r.error && r.data){ const k=m+'|'+cartao; (historico[k]=historico[k]||[]); historico[k].unshift(r.data); }
  }
  setStatus('Sincronizado','ok');
  render(); reabrir(m);
}

function toggleHist(m, cartao){
  const el = document.getElementById('hist-'+m+'-'+cartao);
  if(el) el.classList.toggle('aberto');
}

async function adicionar(mes, categoria){
  setStatus('Salvando...', 'sync');
  const novo = { mes, categoria, descricao:'', valor:0, tipo:'cartao', cartao:'Nubank', pago:false, ordem: Date.now() };
  const { data, error } = await sb.from(TABELA).insert(novo).select().single();
  if(error){ setStatus('Erro: '+error.message,'erro'); return; }
  (categoria==='receita' ? dados[mes].receitas : dados[mes].despesas).push(data);
  setStatus('Sincronizado','ok'); render(); reabrir(mes);
}

async function adicionarDespesa(mes, tipo, cartao){
  setStatus('Salvando...', 'sync');
  const novo = { mes, categoria:'despesa', descricao:'', valor:0, tipo, cartao: cartao || null, pago:false, vencimento:null, ordem: Date.now() };
  const { data, error } = await sb.from(TABELA).insert(novo).select().single();
  if(error){ setStatus('Erro: '+error.message,'erro'); return; }
  dados[mes].despesas.push(data);
  setStatus('Sincronizado','ok'); render(); reabrir(mes);
}

async function remover(id, mes){
  setStatus('Removendo...', 'sync');
  const { error } = await sb.from(TABELA).delete().eq('id', id);
  if(error){ setStatus('Erro: '+error.message,'erro'); return; }
  dados[mes].receitas = dados[mes].receitas.filter(r=>r.id!==id);
  dados[mes].despesas = dados[mes].despesas.filter(r=>r.id!==id);
  setStatus('Sincronizado','ok'); render(); reabrir(mes);
}

function edit(id, campo, valor){
  let mesAlvo=null;
  for(const m of MESES){
    for(const lista of [dados[m].receitas, dados[m].despesas]){
      const item = lista.find(x=>x.id===id);
      if(item){ item[campo] = valor; mesAlvo=m; }
    }
  }
  // pago, tipo e cartao mudam painel e cores -> re-render; valor so atualiza numeros
  if(campo==='pago' || campo==='tipo' || campo==='cartao'){ render(); if(mesAlvo) reabrir(mesAlvo); }
  else if(campo==='vencimento'){ atualizarResumos(); /* cor/badge atualiza no proximo render */ }
  else if(campo==='valor'){ atualizarResumos(); }

  clearTimeout(timers[id+campo]);
  setStatus('Salvando...', 'sync');
  timers[id+campo] = setTimeout(async ()=>{
    const patch = {};
    patch[campo] = (campo==='valor') ? num(valor) : valor;
    const { error } = await sb.from(TABELA).update(patch).eq('id', id);
    setStatus(error ? 'Erro: '+error.message : 'Sincronizado', error?'erro':'ok');
  }, 500);
}

function atualizarResumos(){
  let recTotal=0, despTotal=0, pagoTotal=0, recebidoTotal=0, nubank=0, evolua=0, boletos=0, diversasAno=0;
  MESES.forEach(m => { recTotal+=totalReceitasMes(m); despTotal+=totalDespesasMes(m); pagoTotal+=totalPagoMes(m); recebidoTotal+=totalRecebidoMes(m); nubank+=totalCartaoNome(m,'Nubank'); evolua+=totalCartaoNome(m,'Evolua'); boletos+=totalBoletoMes(m); diversasAno+=totalDiversasMes(m); });
  const saldo=recTotal-despTotal; const abertoTotal=despTotal-pagoTotal;
  document.getElementById('painelGeral').innerHTML = `
    <div class="card"><div class="label">Receita ate dezembro</div><div class="valor verde">${fmt(recTotal)}</div></div>
    <div class="card"><div class="label">Divida ate dezembro</div><div class="valor vermelho">${fmt(despTotal)}</div></div>
    <div class="card"><div class="label">Ja pago (ano)</div><div class="valor roxo">${fmt(pagoTotal)}</div></div>
    <div class="card"><div class="label">Falta pagar (ano)</div><div class="valor amarelo">${fmt(abertoTotal)}</div></div>
    <div class="card"><div class="label">Saldo projetado</div><div class="valor ${saldo>=0?'verde':'vermelho'}">${fmt(saldo)}</div></div>`;
  document.getElementById('painelCartoes').innerHTML = `
    <div class="card"><div class="label">Cartao Nubank (total)</div><div class="valor azul">${fmt(nubank)}</div></div>
    <div class="card"><div class="label">Cartao Evolua (total)</div><div class="valor azul">${fmt(evolua)}</div></div>
    <div class="card"><div class="label">Boletos (total)</div><div class="valor amarelo">${fmt(boletos)}</div></div>
    <div class="card"><div class="label">Despesas diversas (ano)</div><div class="valor roxo">${fmt(diversasAno)}</div></div>
    <div class="card"><div class="label">Recebido (ano)</div><div class="valor verde">${fmt(recebidoTotal)}</div></div>`;
  atualizarAlertaTopo();
  MESES.forEach(m=>{
    const el=document.querySelector(`.mes[data-mes="${m}"] .mes-resumo`);
    if(el){ const rec=totalReceitasMes(m), desp=totalDespesasMes(m), s=rec-desp, pg=totalPagoMes(m);
      el.innerHTML=`<span>Receita <b class="verde">${fmt(rec)}</b></span><span>Despesa <b class="vermelho">${fmt(desp)}</b></span><span>Pago <b class="roxo">${fmt(pg)}</b></span><span>Saldo <b class="${s>=0?'verde':'vermelho'}">${fmt(s)}</b></span>`; }
  });
}

function toggleMes(m){ document.querySelector(`.mes[data-mes="${m}"]`).classList.toggle('aberto'); }
function expandirTodos(abrir){ document.querySelectorAll('.mes').forEach(e => e.classList.toggle('aberto', abrir)); }
function reabrir(m){ document.querySelector(`.mes[data-mes="${m}"]`)?.classList.add('aberto'); }

if(SUPABASE_URL.startsWith('COLE_') || SUPABASE_KEY.startsWith('COLE_')){
  setStatus('Configure SUPABASE_URL e SUPABASE_KEY no codigo (veja o topo do script)', 'erro');
  render();
} else {
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    carregar();
    assinarRealtime();
  } catch (e) {
    setStatus('Erro ao conectar: ' + e.message, 'erro');
    render();
  }
}
</script>
</body>
</html>
